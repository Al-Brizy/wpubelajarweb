<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Belajar Web di WPUCourse.id</title>
    <!--
        Tag yang hanya bisa digunakan di dalam head adalah
        <title>, <style>, <link>, <meta>, <script>, dan <base>
        - Character encoding: <meta charset="UTF-8">
        - Document title: <title>Belajar Web di WPUCourse.id</title>
        - Metadata: <meta name="description" content="Belajar Web di WPUCourse.id">
        - CSS: <style>h1 {color: red;}</style>
        - Favicon: <link rel="icon" href="favicon.ico">
        - Script: <script src="script.js"></script>
        - Comment:  This is a comment / ctrl + /
    -->
  </head>
  <body>
    <!-- 
        Tag yang hanya bisa digunakan di dalam body adalah
        <h1>, <p>, <div>, <span>, <a>, <img>, <ul>, <ol>, <li>, dan lain-lain
        Text: <p>Ini adalah paragraf</p>
        List: <ul><li>Item 1</li><li>Item 2</li></ul>
        Link: <a href="https://wpu.co.id">WPUCourse.id</a>
        Image: <img src="image.jpg" alt="Gambar">
        Multimedia: <video src="video.mp4" controls></video>
        Semantic tag: <header>, <nav>, <main>, <footer>, dll
        Table: <table><tr><td>Cell 1</td><td>Cell 2</td></tr></table>
        Forms: <form><input type="text" name="name"><input type="submit"></form>
        Comment:  This is a comment / ctrl + /    
    -->
  </body>
</html>
