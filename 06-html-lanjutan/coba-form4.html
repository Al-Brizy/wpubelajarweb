<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Elemen Form di Dalam Tabel</title>
  </head>
  <body>
    <h1>Contoh elemen-elemen form pada HTML</h1>
    <form>
      <table cellpadding="7">
        <tr>
          <td align="right">
            <label for="nama">Nama: </label>
          </td>
          <td>
            <input
              type="text"
              name="nama"
              id="nama"
              placeholder="Masukkan Nama"
            />
          </td>
        </tr>

        <tr>
          <td align="right">
            <label for="password">Password: </label>
          </td>
          <td>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Masukkan Password"
            />
          </td>
        </tr>

        <tr>
          <td align="right">
            <label for="email">Email: </label>
          </td>
          <td>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Masukkan Email"
            />
          </td>
        </tr>

        <tr>
          <td align="right">
            <label for="umur">Umur: </label>
          </td>
          <td>
            <input
              type="number"
              name="umur"
              id="umur"
              placeholder="Masukkan Umur"
              min="1"
              max="100"
              step="1"
            />
          </td>
        </tr>

        <tr>
          <td align="right">
            <label for="tanggal lahir">Tanggal Lahir: </label>
          </td>
          <td>
            <input type="date" name="tanggal_lahir" id="tanggal_lahir" />
          </td>
        </tr>

        <tr>
          <td align="right">
            <label for="warna kulit">Warna Kulit: </label>
          </td>
          <td>
            <input
              type="color"
              name="warna_kulit"
              id="warna_kulit"
              placeholder="Masukkan Warna Kulit"
            />
          </td>
        </tr>

        <tr>
          <td align="right">
            <label for="cv">Upload CV: </label>
          </td>
          <td>
            <input type="file" name="cv" id="cv" placeholder="Masukkan CV" />
          </td>
        </tr>

        <tr>
          <td>
            <button type="submit">Kirim</button>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
