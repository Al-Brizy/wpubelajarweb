    <title>Coba Merging Table</title>

  <body>
    <table border="1" cellspacing="0" cellpadding="10">
      <tr>
        <td rowspan="2">RS = 2</td>
        <td colspan="2">CS = 2</td>

      <tr>
        <td>2,2</td>
        <td rowspan="2">RS = 2</td>
      </tr>
      <tr>
        <td colspan="2">CS = 2</td>
      </tr>
    </table>
  </body>
